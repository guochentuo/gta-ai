frontend gta_image_embedding_frontend
    bind 192.168.80.130:18082
    mode http
    option httplog
    option http-keep-alive

    acl internal_service_network src 192.168.80.0/24
    http-request deny unless internal_service_network

    timeout client 5m
    default_backend gta_image_embedding_backend

backend gta_image_embedding_backend
    mode http
    option http-keep-alive
    http-reuse safe
    balance leastconn

    option httpchk GET /health
    http-check expect status 200

    timeout connect 5s
    timeout server 5m
    default-server inter 5s fall 3 rise 2 maxconn 2

    server image-embedding-r740xd-3 192.168.80.3:18082 check weight 200
    server image-embedding-r740xd-5 192.168.80.5:18082 check weight 100
    server image-embedding-r740xd-6 192.168.80.6:18082 check weight 100
    server image-embedding-r740xd-4 192.168.80.4:18082 check backup

