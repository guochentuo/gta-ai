# gta-ai-ocr 的 stdout/stderr（systemd 追加到 logs/service.log）轮转规则。
# 安装：sudo install -m 0644 deploy/logrotate.conf /etc/logrotate.d/gta-ai-ocr
# 上限：单文件超过 20M 即在下次 logrotate 运行时轮转（Ubuntu 默认每天运行；需要更严格的单文件上限时
# 让 logrotate.timer 每小时运行），保留 7 份压缩历史且不超过 14 天；总量约 20M + 7 份压缩文件。
/opt/gta-ai/paddle-ocr/logs/*.log {
  daily
  maxsize 20M
  rotate 7
  maxage 14
  compress
  missingok
  notifempty
  copytruncate
}
