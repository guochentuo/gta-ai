          }
          chat.messages[assistantIndex].pending = false;
        } catch (error) {
          const target = chat.messages[assistantIndex];
          target.pending = false;
          target.text = error.name === "AbortError"
            ? "欢迎内容加载已停止。"
            : `欢迎内容加载失败：${error.message}`;
          target.interrupted = true;
        } finally {
          streaming = false;
          controller = null;
          saveConversations();
          renderHistory();
          updateAssistant(assistantIndex);
          updateQuickPrompts();
          updateSendState();
        }
      }

      async function sendMessage(options = {}) {
        if (streaming) {
          void cancelRequest(activeRequestId);
          controller?.abort();
          return;
        }
        const text = els.prompt.value.trim();
        if (!text && !attachments.length) return;

        const chat = currentConversation();
        const images = [...attachments];
        console.info("[GTA AI Web] 用户发送", {
          content: text,
          imageCount: images.length
        });
        await writeServerLog("用户发送", {
          content: text,
          image_count: images.length
        });
        chat.messages.push({ role: "user", text, images });
        if (chat.messages.filter(message => message.role === "user").length === 1) {
          chat.title = (text || "图片分析").slice(0, 24);
        }
        const assistantIndex = chat.messages.length;
        const requestId = uid();
        activeRequestId = requestId;
        chat.messages.push({
          role: "assistant",
          text: "",
          reasoning: "",
          pending: true,
          interrupted: false,
          requestId
        });
        saveConversations();
        attachments = [];
        els.prompt.value = "";
        resizePrompt();
        renderAttachments();
        renderHistory();
        renderMessages();

        streaming = true;
        controller = new AbortController();
        updateSendState();

        try {
          const thinking = els.thinking?.checked ?? false;
          const browserLocale = navigator.language || "";
          const browserCountry = (browserLocale.split(/[-_]/)[1] || "").toUpperCase();
          const response = await fetch(CHAT_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-GTA-Request-ID": requestId,
              "X-GTA-Session-ID": chat.id,
              "X-GTA-Priority": options.recovery ? "P0" : "P1",
              "X-GTA-Locale": browserLocale,
              "X-GTA-Country": browserCountry
            },
            body: JSON.stringify({
              model: "green-travel-ai",
              messages: apiMessages(chat),
              stream: true,
              chat_template_kwargs: { enable_thinking: options.recovery ? false : thinking },
              max_tokens: options.recovery ? 512 : (thinking ? 2048 : 512),
              temperature: options.recovery ? .2 : (thinking ? .7 : .2)
            }),
            signal: controller.signal
          });
          if (!response.ok) {
            const detail = await response.text();
            throw new Error(`HTTP ${response.status}: ${detail.slice(0, 300)}`);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          let done = false;
          while (!done) {
            const chunk = await reader.read();
            done = chunk.done;
            buffer += decoder.decode(chunk.value || new Uint8Array(), { stream: !done });
            const events = buffer.split(/\r?\n\r?\n/);
            buffer = events.pop() || "";
            for (const event of events) {
              const data = event.split(/\r?\n/)
                .filter(line => line.startsWith("data:"))
                .map(line => line.slice(5).trim())
                .join("\n");
              if (!data) continue;
              if (data === "[DONE]") {
                done = true;
                await reader.cancel();
                break;
              }
              const payload = JSON.parse(data);
              if (payload.error) throw new Error(payload.error);
              const target = chat.messages[assistantIndex];
              if (payload.type === "image_group" && Array.isArray(payload.images)) {
                target.knowledgeImages = payload.images;
                updateAssistant(assistantIndex);
                continue;
              }
              if (payload.type === "contact_request") {
                window.dispatchEvent(new CustomEvent("gta:contact-request", {
                  detail: {
                    conversationId: chat.id,
                    sessionId: chat.sessionId || chat.id,
                    source: "explicit_contact"
                  }
                }));
                continue;
              }
              if (payload.type === "handoff_offer" && payload.prompt && payload.action_label) {
                target.handoffOffer = payload;
                updateAssistant(assistantIndex);
                continue;
              }
              const delta = payload.choices?.[0]?.delta || {};
              const firstVisibleContent = !target.text && typeof delta.content === "string" && delta.content.length > 0;
              if (typeof delta.content === "string") target.text += delta.content;
              const thought = delta.reasoning ?? delta.reasoning_content;
              if (typeof thought === "string") target.reasoning += thought;
              if (firstVisibleContent) {
                // 首个正文 token 立即替换加载动画，后续 token 再使用节流刷新。
                updateAssistant(assistantIndex);
              } else {
                scheduleAssistantUpdate(assistantIndex);
              }
            }
          }
          const target = chat.messages[assistantIndex];
          target.pending = false;
          if (!target.text && target.reasoning) {
            target.text = "思考内容已生成，但最终回答未完成。请增加输出长度或缩小问题范围后重试。";
          }
          if (!target.text && !target.reasoning) target.text = "模型没有返回内容。";
        } catch (error) {
          const target = chat.messages[assistantIndex];
          target.pending = false;
          if (error.name === "AbortError") {
            target.text ||= "已停止生成。";
          } else {
            target.text = `请求失败：${error.message}`;
            target.interrupted = true;
          }
        } finally {
          const pendingUpdate = assistantUpdateTimers.get(assistantIndex);
          if (pendingUpdate) clearTimeout(pendingUpdate);
          assistantUpdateTimers.delete(assistantIndex);
          const target = chat.messages[assistantIndex];
          console.info("[GTA AI Web] 模型返回", {
            content: target.text,
            reasoning: target.reasoning,
            knowledgeImageCount: target.knowledgeImages?.length || 0
          });
          await writeServerLog("模型返回", {
            content: target.text,
            reasoning: target.reasoning,
            image_count: target.knowledgeImages?.length || 0
          });
          streaming = false;
          controller = null;
          activeRequestId = "";
          saveConversations();
          renderHistory();
          updateAssistant(assistantIndex);
          updateSendState();
        }
      }

      function closeSidebar() {
        els.sidebar.classList.remove("open");
        els.backdrop.classList.remove("visible");
      }

      els.prompt.addEventListener("input", resizePrompt);
      els.prompt.addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          sendMessage();
        }
      });
      els.send.addEventListener("click", sendMessage);
      els.quickPrompts.addEventListener("click", event => {
        const button = event.target.closest(".quick-prompt");
        if (!button || streaming) return;
        els.prompt.value = button.textContent.trim();
        resizePrompt();
        void sendMessage();
      });
      els.attach.addEventListener("click", () => els.input.click());
      els.input.addEventListener("change", event => {
        addFiles(event.target.files);
        event.target.value = "";
      });
      els.composer.addEventListener("dragover", event => {
        event.preventDefault();
      });
      els.composer.addEventListener("drop", event => {
        event.preventDefault();
        addFiles(event.dataTransfer.files);
      });
      els.newChat.addEventListener("click", () => {
        if (streaming) return;
        createConversation();
        renderHistory();
        renderMessages();
        closeSidebar();
        els.prompt.focus();
        void requestWelcome();
      });
      els.clearHistory.addEventListener("click", () => {
        if (streaming || !confirm("清空当前浏览器中的全部对话历史？")) return;
        conversations = [];
        createConversation();
        renderHistory();
        renderMessages();
      });
      els.mobileMenu.addEventListener("click", () => {
        els.sidebar.classList.add("open");
        els.backdrop.classList.add("visible");
      });
      els.backdrop.addEventListener("click", closeSidebar);
      els.reviewDrawerBackdrop.addEventListener("click", closeReviewDrawer);
      els.reviewDrawerClose.addEventListener("click", closeReviewDrawer);
      let previousMessageScrollTop = 0;
      els.messages.addEventListener("scroll", () => {
        const currentScrollTop = Math.max(0, els.messages.scrollTop);
        if (currentScrollTop <= 8) {
          els.mobileTopbar.classList.remove("hidden");
        } else if (currentScrollTop > previousMessageScrollTop + 4) {
          els.mobileTopbar.classList.add("hidden");
        } else if (currentScrollTop < previousMessageScrollTop - 4) {
          els.mobileTopbar.classList.remove("hidden");
        }
        previousMessageScrollTop = currentScrollTop;
      }, { passive: true });
      els.messages.addEventListener("click", event => {
        if (event.target.closest(".google-review-drawer-button")) openReviewDrawer();
        if (event.target.closest(".platform-review-drawer-button")) openPlatformReviewDrawer();
      });
      els.historyMenu.addEventListener("click", event => {
        event.stopPropagation();
        const button = event.target.closest("button[data-action]");
        if (button) void handleHistoryAction(button.dataset.action);
      });
      document.addEventListener("click", event => {
        if (!event.target.closest(".history-menu") && !event.target.closest(".history-more")) closeHistoryMenu();
      });
      document.addEventListener("contextmenu", event => {
        if (!event.target.closest(".history-row") && !event.target.closest(".history-menu")) closeHistoryMenu();
      });
      window.addEventListener("resize", closeHistoryMenu);
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          closeHistoryMenu();
          closeReviewDrawer();
        }
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
          event.preventDefault();
          if (!streaming) els.newChat.click();
        }
      });

      renderHistory();
      renderMessages();
      renderAttachments();
      resizePrompt();
      void requestWelcome();
      els.prompt.focus();
    })();
  </script>
</body>
