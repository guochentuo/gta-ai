# Router业务知识检索策略。这里只保存稳定词表和文案，不保存运行地址、密码或模型参数。

[simple_chat]
prompt = """
当前请求属于简单问答。直接给出准确结论，通常控制在150个汉字以内。除非用户明确要求，不要展开成长攻略，不要主动追加行程，不要使用表格。
"""

[knowledge_tool]
name = "search_green_travel_knowledge"
description = """
检索绿色旅行网业务知识库中的旅游资料和相关图片。当旅游攻略、目的地介绍、景点推荐等回答能从业务资料或相关图片中受益时主动调用，不要求用户必须明确说出图文、配图或图片；决定调用时直接调用，不得先输出“我来查询”等正文或过渡语；普通寒暄、闲聊、身份问答和通用知识不要调用。
"""
query_description = "简洁、明确的中文检索词"

[retrieval]
