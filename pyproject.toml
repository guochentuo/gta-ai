[project]
name = "gta-ai-workspace"
version = "0.1.0"
description = "GTA AI模块工作区。"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "confluent-kafka>=2.8,<3",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "redis>=5.2,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = [
  "qwen-llm/tests",
]
pythonpath = [
  ".",
  "qwen-llm",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"faster-whisper/app.py" = ["RUF003"]
"siglip/app.py" = ["B008", "RUF002"]
"paddle-ocr/app.py" = ["B008", "RUF002", "RUF003"]
"qwen-llm/router/app.py" = ["RUF001", "RUF002", "RUF003"]
"qwen-llm/router/services/pricing_service.py" = ["RUF001", "RUF002", "RUF003"]
"qwen-llm/router/services/context_classification_service.py" = ["RUF001", "RUF002", "RUF003"]
"qwen-llm/tests/test_pricing_service.py" = ["RUF001", "RUF003"]
"qwen-llm/router/summarization.py" = ["RUF001", "RUF003"]
