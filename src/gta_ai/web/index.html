<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>GTA AI</title>
  <style>
    :root {
      --sidebar: #171717;
      --sidebar-hover: #2a2a2a;
      --page: #ffffff;
      --surface: #f4f4f4;
      --surface-strong: #ececec;
      --text: #202123;
      --muted: #6b6b6b;
      --line: #e5e5e5;
      --accent: #10a37f;
      --accent-hover: #0d8f70;
      --danger: #dc2626;
      --shadow: 0 8px 30px rgba(0, 0, 0, .08);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      background: var(--page);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, textarea { font: inherit; }
    button { color: inherit; }

    .app {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
    }

    .sidebar {
      position: relative;
      z-index: 20;
      display: flex;
      min-width: 0;
      flex-direction: column;
      padding: 12px;
      color: #f5f5f5;
      background: var(--sidebar);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 4px 8px 12px;
      font-weight: 650;
      letter-spacing: -.01em;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 9px;
      color: white;
      background: var(--accent);
      font-size: 13px;
      font-weight: 800;
    }

    .new-chat {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 9px;
      color: #f5f5f5;
      background: transparent;
      cursor: pointer;
      transition: background .15s ease;
    }

    .new-chat:hover, .history-item:hover, .history-item.active { background: var(--sidebar-hover); }

    .history-label {
      padding: 20px 9px 8px;
      color: #9b9b9b;
      font-size: 12px;
    }

    .history {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
    }

    .history-item {
      width: 100%;
      overflow: hidden;
      padding: 10px 11px;
      border: 0;
      border-radius: 9px;
      color: #e8e8e8;
      background: transparent;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .sidebar-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 8px 4px;
      border-top: 1px solid #303030;
      color: #a8a8a8;
      font-size: 12px;
    }

    .clear-history {
      padding: 5px 7px;
      border: 0;
      border-radius: 6px;
      color: #aaa;
      background: transparent;
      cursor: pointer;
    }

    .clear-history:hover { color: white; background: #303030; }

    .main {
      display: grid;
      height: 100%;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      grid-template-rows: 56px minmax(0, 1fr) auto;
      background: var(--page);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid transparent;
    }

    .model {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 16px;
      font-weight: 650;
    }

    .model-subtitle {
      color: var(--muted);
      font-size: 12px;
      font-weight: 450;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #a3a3a3;
    }

    .status-dot.ready { background: var(--accent); box-shadow: 0 0 0 3px rgba(16, 163, 127, .12); }
    .status-dot.error { background: var(--danger); }

    .messages {
      min-height: 0;
      overflow-x: hidden;
      overflow-y: scroll;
      padding-bottom: 24px;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      scrollbar-color: #a8a8a8 transparent;
      scrollbar-gutter: stable;
      scrollbar-width: auto;
    }

    .messages::-webkit-scrollbar { width: 12px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb {
      min-height: 48px;
      border: 3px solid var(--page);
      border-radius: 999px;
      background: #a8a8a8;
    }
    .messages::-webkit-scrollbar-thumb:hover { background: #7f7f7f; }

    .welcome {
      display: grid;
      max-width: 760px;
      min-height: 100%;
      margin: 0 auto;
      padding: 12vh 24px 160px;
      align-content: center;
      text-align: center;
    }

    .welcome-mark {
      display: grid;
      width: 52px;
      height: 52px;
      margin: 0 auto 22px;
      place-items: center;
      border-radius: 16px;
      color: white;
      background: var(--accent);
      font-size: 20px;
      font-weight: 800;
      box-shadow: var(--shadow);
    }

    .welcome h1 {
      margin: 0;
      font-size: clamp(27px, 4vw, 34px);
      letter-spacing: -.035em;
    }

    .welcome p {
      max-width: 620px;
      margin: 14px auto 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 34px;
    }

    .suggestion {
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      background: var(--page);
      text-align: left;
      line-height: 1.45;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }

    .suggestion:hover { border-color: #cfcfcf; background: var(--surface); }

    .message-row { width: 100%; }

    .message-inner {
      display: flex;
      width: min(800px, calc(100% - 40px));
      margin: 0 auto;
      padding: 18px 0;
    }

    .message-row.user .message-inner { justify-content: flex-end; }

    .bubble {
      max-width: min(680px, 85%);
      overflow-wrap: anywhere;
      line-height: 1.72;
    }

    .user .bubble {
      padding: 10px 16px;
      border-radius: 18px;
      background: var(--surface-strong);
      white-space: pre-wrap;
    }

    .assistant .bubble { width: 100%; max-width: 100%; }

    .assistant-content h1, .assistant-content h2, .assistant-content h3 {
      margin: 1.1em 0 .45em;
      line-height: 1.35;
    }

    .assistant-content p { margin: 0 0 .85em; }
    .assistant-content strong { font-weight: 700; }

    .assistant-content pre {
      overflow-x: auto;
      padding: 14px;
      border-radius: 10px;
      color: #f3f3f3;
      background: #1f1f1f;
      line-height: 1.55;
    }

    .assistant-content code {
      padding: 2px 5px;
      border-radius: 5px;
      background: var(--surface-strong);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .9em;
    }

    .assistant-content pre code { padding: 0; background: transparent; }

    .reasoning {
      margin-bottom: 12px;
      padding: 10px 12px;
      border-left: 3px solid #c7c7c7;
      color: var(--muted);
      font-size: 13px;
    }

    .reasoning summary { cursor: pointer; font-weight: 600; }
    .reasoning-body { margin-top: 9px; white-space: pre-wrap; }

    .image-strip {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 8px;
    }

    .image-strip img {
      width: 112px;
      height: 84px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--line);
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 24px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8b8b8b;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: .16s; }
    .typing span:nth-child(3) { animation-delay: .32s; }

    @keyframes pulse {
      0%, 70%, 100% { transform: scale(.75); opacity: .45; }
      35% { transform: scale(1); opacity: 1; }
    }

    .composer-area {
      padding: 12px 20px 18px;
      background: linear-gradient(0deg, var(--page) 80%, rgba(255,255,255,0));
    }

    .composer-wrap { width: min(800px, 100%); margin: 0 auto; }

    .attachment-preview {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 12px 0;
      border: 1px solid var(--line);
      border-bottom: 0;
      border-radius: 18px 18px 0 0;
      background: var(--page);
    }

    .attachment-preview.visible { display: flex; }

    .attachment {
      position: relative;
      width: 72px;
      height: 58px;
    }

    .attachment img { width: 100%; height: 100%; border-radius: 8px; object-fit: cover; }

    .remove-attachment {
      position: absolute;
      top: -6px;
      right: -6px;
      display: grid;
      width: 20px;
      height: 20px;
      padding: 0;
      place-items: center;
      border: 1px solid #fff;
      border-radius: 50%;
      color: white;
      background: #333;
      cursor: pointer;
    }

    .composer {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--page);
      box-shadow: var(--shadow);
    }

    .attachment-preview.visible + .composer { border-radius: 0 0 24px 24px; }

    .icon-button {
      display: grid;
      width: 34px;
      height: 34px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
    }

    .icon-button:hover { background: var(--surface); }

    #prompt {
      width: 100%;
      max-height: 180px;
      min-height: 34px;
      resize: none;
      padding: 7px 2px 4px;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      line-height: 1.45;
    }

    #prompt::placeholder { color: #8f8f8f; }

    .send {
      color: white;
      background: #111;
    }

    .send:hover { background: #333; }
    .send:disabled { color: #aaa; background: var(--surface-strong); cursor: default; }

    .mode-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 7px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .thinking-toggle { display: flex; align-items: center; gap: 7px; cursor: pointer; }
    .thinking-toggle input { accent-color: var(--accent); }

    .disclaimer { text-align: right; }

    .mobile-menu { display: none; }
    .sidebar-backdrop { display: none; }

    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 270px;
        transform: translateX(-100%);
        transition: transform .2s ease;
      }

      .sidebar.open { transform: translateX(0); }

      .sidebar-backdrop {
        position: fixed;
        z-index: 15;
        inset: 0;
        background: rgba(0,0,0,.42);
      }

      .sidebar-backdrop.visible { display: block; }
      .mobile-menu { display: grid; }
      .topbar { padding: 0 12px; }
      .model-subtitle { display: none; }
      .message-inner { width: calc(100% - 28px); }
      .composer-area { padding: 10px 12px 12px; }
      .suggestions { grid-template-columns: 1fr; }
      .welcome { padding-top: 6vh; }
      .disclaimer { display: none; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #212121;
        --surface: #2f2f2f;
        --surface-strong: #303030;
        --text: #ececec;
        --muted: #a5a5a5;
        --line: #424242;
        --shadow: 0 8px 30px rgba(0, 0, 0, .22);
      }

      .composer-area { background: linear-gradient(0deg, var(--page) 80%, rgba(33,33,33,0)); }
      .send { color: #111; background: #fff; }
      .send:hover { background: #ddd; }
      .assistant-content pre { background: #101010; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">GTA</span><span>GTA AI</span></div>
      <button class="new-chat" id="newChat" type="button">
        <span>＋ 新对话</span><span>⌘ K</span>
      </button>
      <div class="history-label">最近对话</div>
      <nav class="history" id="history"></nav>
      <div class="sidebar-footer">
        <span>仅保存在当前浏览器</span>
        <button class="clear-history" id="clearHistory" type="button">清空</button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <main class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:10px">
          <button class="icon-button mobile-menu" id="mobileMenu" type="button" aria-label="打开菜单">☰</button>
          <div class="model">
            <span>Qwen3.6 27B</span>
            <span class="model-subtitle">本地 FP8 · 32K</span>
          </div>
        </div>
        <div class="status" title="本地模型服务状态">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">检查中</span>
        </div>
      </header>

      <section class="messages" id="messages"></section>

      <section class="composer-area">
        <div class="composer-wrap">
          <div class="attachment-preview" id="attachmentPreview"></div>
          <div class="composer" id="composer">
            <button class="icon-button" id="attachButton" type="button" aria-label="上传图片" title="上传图片或视频关键帧">＋</button>
            <textarea id="prompt" rows="1" placeholder="给 GTA AI 发送消息" autocomplete="off"></textarea>
            <button class="icon-button send" id="sendButton" type="button" aria-label="发送">↑</button>
          </div>
          <div class="mode-row">
            <label class="thinking-toggle" title="深度思考会显著增加生成时间">
              <input id="thinking" type="checkbox">
              <span>深度思考</span>
            </label>
            <span class="disclaimer">本地模型可能出错，关键结论仍需 OpenAI 最终复核</span>
          </div>
          <input id="fileInput" type="file" accept="image/*" multiple hidden>
        </div>
      </section>
    </main>
  </div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "gta-ai-chat-history-v1";
      const SYSTEM_PROMPT = "你是公司内部 GTA AI 数据分析助手。请基于用户提供的数据和素材回答；区分事实、假设和建议；缺少证据时明确说明。";
      const MAX_CONVERSATIONS = 20;
      const MAX_IMAGES = 4;

      const els = {
        messages: document.getElementById("messages"),
        prompt: document.getElementById("prompt"),
        send: document.getElementById("sendButton"),
        attach: document.getElementById("attachButton"),
        input: document.getElementById("fileInput"),
        previews: document.getElementById("attachmentPreview"),
        thinking: document.getElementById("thinking"),
        history: document.getElementById("history"),
        newChat: document.getElementById("newChat"),
        clearHistory: document.getElementById("clearHistory"),
        statusDot: document.getElementById("statusDot"),
        statusText: document.getElementById("statusText"),
        sidebar: document.getElementById("sidebar"),
        backdrop: document.getElementById("sidebarBackdrop"),
        mobileMenu: document.getElementById("mobileMenu"),
        composer: document.getElementById("composer")
      };

      let conversations = loadConversations();
      let activeId = conversations[0]?.id || "";
      let attachments = [];
      let controller = null;
      let streaming = false;

      if (!activeId) createConversation();

      function uid() {
        return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function loadConversations() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          return Array.isArray(parsed) ? parsed : [];
        } catch (_) {
          return [];
        }
      }

      function saveConversations() {
        try {
          const compact = conversations.slice(0, MAX_CONVERSATIONS).map(chat => ({
            ...chat,
            messages: chat.messages.map(message => ({
              ...message,
              images: []
            }))
          }));
          localStorage.setItem(STORAGE_KEY, JSON.stringify(compact));
        } catch (_) {
          // The current chat still works when browser storage is unavailable.
        }
      }

      function createConversation() {
        const chat = { id: uid(), title: "新对话", messages: [], createdAt: Date.now() };
        conversations.unshift(chat);
        activeId = chat.id;
        saveConversations();
        return chat.id;
      }

      function currentConversation() {
        let chat = conversations.find(item => item.id === activeId);
        if (!chat) {
          activeId = createConversation();
          chat = conversations.find(item => item.id === activeId);
        }
        return chat;
      }

      function escapeHtml(value) {
        return value.replace(/[&<>"]/g, char => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;"
        })[char]);
      }

      function renderMarkdown(value) {
        const blocks = [];
        let html = escapeHtml(value || "").replace(/```(?:\w+)?\n?([\s\S]*?)```/g, (_, code) => {
          const marker = `%%CODE_BLOCK_${blocks.length}%%`;
          blocks.push(`<pre><code>${code.trim()}</code></pre>`);
          return marker;
        });
        html = html
          .replace(/^### (.*)$/gm, "<h3>$1</h3>")
          .replace(/^## (.*)$/gm, "<h2>$1</h2>")
          .replace(/^# (.*)$/gm, "<h1>$1</h1>")
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .split(/\n{2,}/)
          .map(part => part.startsWith("<h") || part.startsWith("%%CODE_BLOCK_") ? part : `<p>${part.replace(/\n/g, "<br>")}</p>`)
          .join("");
        blocks.forEach((block, index) => {
          html = html.replace(`%%CODE_BLOCK_${index}%%`, block);
        });
        return html;
      }

      function welcomeHtml() {
        return `
          <div class="welcome">
            <div class="welcome-mark">GTA</div>
            <h1>今天想分析什么？</h1>
            <p>这是运行在当前服务器 L40 上的本地 Qwen3.6 27B。可以分析数据、审核文章、理解截图，也可以一次上传多张视频关键帧。</p>
            <div class="suggestions">
              <button class="suggestion" data-prompt="帮我分析这组数据：展示10000、点击520、转化31、花费2800元。计算CTR、CVR、CPA，并给出建议。">分析广告转化数据</button>
              <button class="suggestion" data-prompt="请审核下面这段文章，分别列出事实、风险、需要核实的信息和修改建议：">审核一篇待发布文章</button>
              <button class="suggestion" data-prompt="根据我接下来提供的事实简报，写一篇结构清晰的新文章，不要补充未给出的数据。">根据简报生成文章</button>
              <button class="suggestion" data-prompt="请按时间顺序分析我上传的多张视频关键帧，提取画面文字、核心卖点、风险和行动号召。">分析视频关键帧</button>
            </div>
          </div>`;
      }

      function renderMessages() {
        const chat = currentConversation();
        if (!chat.messages.length) {
          els.messages.innerHTML = welcomeHtml();
          els.messages.querySelectorAll(".suggestion").forEach(button => {
            button.addEventListener("click", () => {
              els.prompt.value = button.dataset.prompt || "";
              resizePrompt();
              els.prompt.focus();
            });
          });
          return;
        }

        els.messages.innerHTML = chat.messages.map((message, index) => {
          const images = (message.images || []).length
            ? `<div class="image-strip">${message.images.map(src => `<img src="${src}" alt="上传图片">`).join("")}</div>`
            : "";
          if (message.role === "user") {
            return `<article class="message-row user"><div class="message-inner"><div class="bubble">${images}${escapeHtml(message.text || "")}</div></div></article>`;
          }
          const reasoning = message.reasoning
            ? `<details class="reasoning" open><summary>思考过程</summary><div class="reasoning-body">${escapeHtml(message.reasoning)}</div></details>`
            : "";
          const content = message.pending
            ? `<div class="typing" aria-label="正在生成"><span></span><span></span><span></span></div>`
            : `<div class="assistant-content">${renderMarkdown(message.text || "")}</div>`;
          return `<article class="message-row assistant" data-index="${index}"><div class="message-inner"><div class="bubble">${reasoning}${content}</div></div></article>`;
        }).join("");
        scrollToBottom();
      }

      function updateAssistant(index) {
        const message = currentConversation().messages[index];
        const row = els.messages.querySelector(`[data-index="${index}"] .bubble`);
        if (!row) {
          renderMessages();
          return;
        }
        const reasoning = message.reasoning
          ? `<details class="reasoning" open><summary>思考过程</summary><div class="reasoning-body">${escapeHtml(message.reasoning)}</div></details>`
          : "";
        const body = message.pending && !message.text
          ? `<div class="typing"><span></span><span></span><span></span></div>`
          : `<div class="assistant-content">${renderMarkdown(message.text || "")}</div>`;
        row.innerHTML = reasoning + body;
        scrollToBottom();
      }

      function renderHistory() {
        els.history.innerHTML = conversations.map(chat => `
          <button type="button" class="history-item ${chat.id === activeId ? "active" : ""}" data-id="${chat.id}">${escapeHtml(chat.title)}</button>
        `).join("");
        els.history.querySelectorAll(".history-item").forEach(button => {
          button.addEventListener("click", () => {
            if (streaming) return;
            activeId = button.dataset.id;
            renderHistory();
            renderMessages();
            closeSidebar();
          });
        });
      }

      function scrollToBottom() {
        requestAnimationFrame(() => {
          els.messages.scrollTop = els.messages.scrollHeight;
        });
      }

      function resizePrompt() {
        els.prompt.style.height = "auto";
        els.prompt.style.height = `${Math.min(els.prompt.scrollHeight, 180)}px`;
        updateSendState();
      }

      function updateSendState() {
        const canSend = els.prompt.value.trim() || attachments.length;
        els.send.disabled = !streaming && !canSend;
        els.send.textContent = streaming ? "■" : "↑";
        els.send.setAttribute("aria-label", streaming ? "停止生成" : "发送");
      }

      function renderAttachments() {
        els.previews.classList.toggle("visible", attachments.length > 0);
        els.previews.innerHTML = attachments.map((src, index) => `
          <div class="attachment"><img src="${src}" alt="待发送图片"><button type="button" class="remove-attachment" data-index="${index}">×</button></div>
        `).join("");
        els.previews.querySelectorAll(".remove-attachment").forEach(button => {
          button.addEventListener("click", () => {
            attachments.splice(Number(button.dataset.index), 1);
            renderAttachments();
            updateSendState();
          });
        });
      }

      function resizeImage(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = reject;
          reader.onload = () => {
            const image = new Image();
            image.onerror = reject;
            image.onload = () => {
              const maxSide = 1600;
              const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
              const canvas = document.createElement("canvas");
              canvas.width = Math.max(1, Math.round(image.width * scale));
              canvas.height = Math.max(1, Math.round(image.height * scale));
              const context = canvas.getContext("2d");
              context.drawImage(image, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL("image/jpeg", .86));
            };
            image.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      }

      async function addFiles(files) {
        const available = MAX_IMAGES - attachments.length;
        const selected = Array.from(files).filter(file => file.type.startsWith("image/")).slice(0, available);
        for (const file of selected) {
          try {
            attachments.push(await resizeImage(file));
          } catch (_) {
            alert(`无法读取图片：${file.name}`);
          }
        }
        renderAttachments();
        updateSendState();
      }

      function apiMessages(chat) {
        const result = [{ role: "system", content: SYSTEM_PROMPT }];
        chat.messages.forEach(message => {
          if (message.role === "assistant" && message.pending) return;
          if (message.role === "user" && message.images?.length) {
            result.push({
              role: "user",
              content: [
                ...message.images.map(url => ({ type: "image_url", image_url: { url } })),
                { type: "text", text: message.text || "请分析这些图片。" }
              ]
            });
          } else {
            result.push({ role: message.role, content: message.text || "" });
          }
        });
        return result;
      }

      async function sendMessage() {
        if (streaming) {
          controller?.abort();
          return;
        }
        const text = els.prompt.value.trim();
        if (!text && !attachments.length) return;

        const chat = currentConversation();
        const images = [...attachments];
        chat.messages.push({ role: "user", text, images });
        if (chat.messages.length === 1) {
          chat.title = (text || "图片分析").slice(0, 24);
        }
        const assistantIndex = chat.messages.length;
        chat.messages.push({ role: "assistant", text: "", reasoning: "", pending: true });
        attachments = [];
        els.prompt.value = "";
        resizePrompt();
        renderAttachments();
        renderHistory();
        renderMessages();

        streaming = true;
        controller = new AbortController();
        updateSendState();

        try {
          const thinking = els.thinking.checked;
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              messages: apiMessages(chat),
              enable_thinking: thinking,
              max_tokens: thinking ? 4096 : 2048,
              temperature: thinking ? .7 : .2
            }),
            signal: controller.signal
          });
          if (!response.ok) {
            const detail = await response.text();
            throw new Error(`HTTP ${response.status}: ${detail.slice(0, 300)}`);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          let done = false;
          while (!done) {
            const chunk = await reader.read();
            done = chunk.done;
            buffer += decoder.decode(chunk.value || new Uint8Array(), { stream: !done });
            const events = buffer.split(/\r?\n\r?\n/);
            buffer = events.pop() || "";
            for (const event of events) {
              const data = event.split(/\r?\n/)
                .filter(line => line.startsWith("data:"))
                .map(line => line.slice(5).trim())
                .join("\n");
              if (!data || data === "[DONE]") continue;
              const payload = JSON.parse(data);
              if (payload.error) throw new Error(payload.error);
              const delta = payload.choices?.[0]?.delta || {};
              const target = chat.messages[assistantIndex];
              if (typeof delta.content === "string") target.text += delta.content;
              const thought = delta.reasoning ?? delta.reasoning_content;
              if (typeof thought === "string") target.reasoning += thought;
              target.pending = false;
              updateAssistant(assistantIndex);
            }
          }
          const target = chat.messages[assistantIndex];
          target.pending = false;
          if (!target.text && target.reasoning) {
            target.text = "思考内容已生成，但最终回答未完成。请增加输出长度或缩小问题范围后重试。";
          }
          if (!target.text && !target.reasoning) target.text = "模型没有返回内容。";
        } catch (error) {
          const target = chat.messages[assistantIndex];
          target.pending = false;
          if (error.name === "AbortError") {
            target.text ||= "已停止生成。";
          } else {
            target.text = `请求失败：${error.message}`;
          }
        } finally {
          streaming = false;
          controller = null;
          saveConversations();
          renderHistory();
          updateAssistant(assistantIndex);
          updateSendState();
        }
      }

      async function checkHealth() {
        try {
          const response = await fetch("/health/ready", { cache: "no-store" });
          const body = await response.json();
          if (response.ok && body.state === "ok") {
            els.statusDot.className = "status-dot ready";
            els.statusText.textContent = "模型就绪";
          } else {
            throw new Error("not ready");
          }
        } catch (_) {
          els.statusDot.className = "status-dot error";
          els.statusText.textContent = "模型未就绪";
        }
      }

      function closeSidebar() {
        els.sidebar.classList.remove("open");
        els.backdrop.classList.remove("visible");
      }

      els.prompt.addEventListener("input", resizePrompt);
      els.prompt.addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          sendMessage();
        }
      });
      els.send.addEventListener("click", sendMessage);
      els.attach.addEventListener("click", () => els.input.click());
      els.input.addEventListener("change", event => {
        addFiles(event.target.files);
        event.target.value = "";
      });
      els.composer.addEventListener("dragover", event => {
        event.preventDefault();
      });
      els.composer.addEventListener("drop", event => {
        event.preventDefault();
        addFiles(event.dataTransfer.files);
      });
      els.newChat.addEventListener("click", () => {
        if (streaming) return;
        createConversation();
        renderHistory();
        renderMessages();
        closeSidebar();
        els.prompt.focus();
      });
      els.clearHistory.addEventListener("click", () => {
        if (streaming || !confirm("清空当前浏览器中的全部对话历史？")) return;
        conversations = [];
        createConversation();
        renderHistory();
        renderMessages();
      });
      els.mobileMenu.addEventListener("click", () => {
        els.sidebar.classList.add("open");
        els.backdrop.classList.add("visible");
      });
      els.backdrop.addEventListener("click", closeSidebar);
      document.addEventListener("keydown", event => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
          event.preventDefault();
          if (!streaming) els.newChat.click();
        }
      });

      renderHistory();
      renderMessages();
      renderAttachments();
      resizePrompt();
      checkHealth();
      setInterval(checkHealth, 30000);
      els.prompt.focus();
    })();
  </script>
</body>
</html>
